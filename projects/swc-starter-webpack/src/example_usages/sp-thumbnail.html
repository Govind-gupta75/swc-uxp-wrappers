<h3>sp-thumbnail</h3>
<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-thumbnail</div>

            <!-- sizes -->
            <h4>sizes</h4>
            <div style="display: flex; align-items: flex-end; flex-wrap: wrap;">
                <div style="display: block;">
                    <sp-thumbnail size="100">
                        <img src="https://picsum.photos/200/200?random=1" alt="size 100" />
                    </sp-thumbnail>
                </div>
                <div style="display: block; margin-left: 16px;">
                    <sp-thumbnail size="300">
                        <img src="https://picsum.photos/200/200?random=1" alt="size 300" />
                    </sp-thumbnail>
                </div>
                <div style="display: block; margin-left: 16px;">
                    <sp-thumbnail size="500">
                        <img src="https://picsum.photos/200/200?random=1" alt="size 500" />
                    </sp-thumbnail>
                </div>
                <div style="display: block; margin-left: 16px;">
                    <sp-thumbnail size="700">
                        <img src="https://picsum.photos/200/200?random=1" alt="size 700" />
                    </sp-thumbnail>
                </div>
                <div style="display: block; margin-left: 16px;">
                    <sp-thumbnail size="900">
                        <img src="https://picsum.photos/200/200?random=1" alt="size 900" />
                    </sp-thumbnail>
                </div>
            </div>

            <!-- cover: image fills the thumbnail area -->
            <h4>cover</h4>
            <sp-thumbnail size="500" cover>
                <img src="https://picsum.photos/400/200?random=2" alt="cover image" />
            </sp-thumbnail>

            <!-- background color: shown behind transparent images -->
            <h4>background color</h4>
            <sp-thumbnail size="500" background="#b3d4f5">
                <img src="https://picsum.photos/200/200?random=3" alt="with background" />
            </sp-thumbnail>

            <!-- non-square: letterboxing for portrait and landscape images -->
            <h4>non-square (letterboxing)</h4>
            <div style="display: flex; align-items: flex-end;">
                <div style="display: block;">
                    <sp-thumbnail size="500">
                        <img src="https://picsum.photos/300/400" alt="portrait image" />
                    </sp-thumbnail>
                </div>
                <div style="display: block; margin-left: 16px;">
                    <sp-thumbnail size="500">
                        <img src="https://picsum.photos/500/100" alt="landscape image" />
                    </sp-thumbnail>
                </div>
            </div>

            <!-- layer mode: renders a checkerboard pattern (UXP fallback: gray-100) -->
            <h4>layer</h4>
            <div style="display: flex; align-items: flex-end;">
                <div style="display: block;">
                    <sp-thumbnail size="500" layer>
                        <img src="https://picsum.photos/200/200?random=4" alt="layer" />
                    </sp-thumbnail>
                </div>
                <div style="display: block; margin-left: 16px;">
                    <sp-thumbnail size="500" layer selected>
                        <img src="https://picsum.photos/500/100" alt="layer selected" />
                    </sp-thumbnail>
                </div>
            </div>

            <!-- focused state -->
            <h4>focused</h4>
            <sp-thumbnail size="500" focused>
                <img src="https://picsum.photos/200/200?random=7" alt="focused thumbnail" />
            </sp-thumbnail>

            <!-- disabled state -->
            <h4>disabled</h4>
            <sp-thumbnail size="500" disabled>
                <img src="https://picsum.photos/200/200?random=8" alt="disabled thumbnail" />
            </sp-thumbnail>
        </div>
        <input type="text" style="width: 2px" />
        <div id="right">
            <div id="subtitle">my-thumbnail</div>

            <h4>default</h4>
            <my-thumbnail size="500">
                <img src="https://picsum.photos/200/200?random=5" alt="custom thumbnail" />
            </my-thumbnail>

            <h4>cover</h4>
            <my-thumbnail size="500" cover>
                <img src="https://picsum.photos/400/200?random=6" alt="custom cover" />
            </my-thumbnail>

            <h4>layer selected</h4>
            <my-thumbnail size="500" layer selected>
                <img src="https://picsum.photos/200/200?random=9" alt="custom layer selected" />
            </my-thumbnail>

            <h4>focused</h4>
            <my-thumbnail size="500" focused>
                <img src="https://picsum.photos/200/200?random=10" alt="custom focused" />
            </my-thumbnail>

            <h4>disabled</h4>
            <my-thumbnail size="500" disabled>
                <img src="https://picsum.photos/200/200?random=11" alt="custom disabled" />
            </my-thumbnail>
        </div>
    </div>
    <div id="config">
        <div style="display: inline-flex"></div>
        <div style="display: flex; flex-direction: column"></div>
    </div>
</div>
