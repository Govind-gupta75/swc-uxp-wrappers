<h3>sp-slider</h3>

<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-slider</div>

            <h4 class="spectrum-Heading--subtitle1">Sizes</h4>
            <div style="display: flex; flex-direction: column; margin-bottom: 16px; width: 240px;">
                <sp-slider size="s" value="50" label="Small"></sp-slider>
                <sp-slider size="m" value="50" label="Medium (default)" style="margin-top: 16px;"></sp-slider>
                <sp-slider size="l" value="50" label="Large" style="margin-top: 16px;"></sp-slider>
                <sp-slider size="xl" value="50" label="Extra Large" style="margin-top: 16px;"></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Default</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider label="Opacity" value="40" min="0" max="100"></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Filled Variant</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider variant="filled" label="Volume" value="60" min="0" max="100"></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Ramp Variant</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider variant="ramp" label="Brush Size" value="30" min="0" max="100"></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Tick Variant</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider variant="tick" tick-step="20" label="Steps" value="40" min="0" max="100"></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Tick with Labels</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider variant="tick" tick-step="25" tick-labels label="Labeled Ticks" value="50" min="0" max="100"></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Disabled</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider label="Disabled" value="30" disabled></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Side Label</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider label-visibility="value" label="Side Label" value="70"></sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Range (two handles)</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider variant="range" min="0" max="100" label="Range">
                    <sp-slider-handle slot="handle" name="start" value="20"></sp-slider-handle>
                    <sp-slider-handle slot="handle" name="end" value="80"></sp-slider-handle>
                </sp-slider>
            </div>

            <h4 class="spectrum-Heading--subtitle1">Quiet</h4>
            <div style="width: 240px; margin-bottom: 16px;">
                <sp-slider quiet label="Quiet" value="45"></sp-slider>
            </div>
        </div>
        <input type="text" style="width: 2px" />
        <div id="right">
            <div id="subtitle">my-slider</div>
            <div style="width: 200px;">
                <my-slider label="My Slider" value="50"></my-slider>
            </div>
        </div>
    </div>

    <div id="config">
        <div style="display: inline-flex"></div>
        <div style="display: flex; flex-direction: column"></div>
    </div>
</div>
