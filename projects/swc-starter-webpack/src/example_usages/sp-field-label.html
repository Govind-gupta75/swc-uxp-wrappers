<h3>sp-field-label</h3>

<div id="content">
    <div id="playground">
        <div id="left">
            <div id="subtitle">sp-field-label</div>
            <div>
                <sp-field-label for="lifestory-1" style="width: 100px">
                    Life Story
                </sp-field-label>
                <sp-textfield
                    placeholder="Enter your life story"
                    id="lifestory-1"
                ></sp-textfield>
                <br />
                <sp-field-label
                    for="lifestory-2"
                    side-aligned="start"
                    style="width: 100px"
                >
                    Life Story
                </sp-field-label>
                <sp-textfield
                    placeholder="Enter your life story"
                    id="lifestory-2"
                ></sp-textfield>
                <br />
                <sp-field-label
                    required
                    for="lifestory-3"
                    side-aligned="end"
                    style="width: 100px"
                >
                    Life Story
                </sp-field-label>
                <sp-textfield
                    placeholder="Enter your life story"
                    id="lifestory-3"
                ></sp-textfield>
                <br />
                <sp-field-label
                    required
                    disabled
                    for="lifestory-4"
                    side-aligned="end"
                    style="width: 100px"
                >
                    Life Story
                </sp-field-label>
                <sp-textfield
                    placeholder="Enter your life story"
                    id="lifestory-4"
                ></sp-textfield>
            </div>

            <div id="variantLabel">sizes</div>
            <div>
                <sp-field-label for="lifestory-size-s" size="s" style="width: 100px">
                    Small
                </sp-field-label>
                <sp-textfield placeholder="size=s" id="lifestory-size-s"></sp-textfield>
                <br />
                <sp-field-label for="lifestory-size-m" size="m" style="width: 100px">
                    Medium
                </sp-field-label>
                <sp-textfield placeholder="size=m" id="lifestory-size-m"></sp-textfield>
                <br />
                <sp-field-label for="lifestory-size-l" size="l" style="width: 100px">
                    Large
                </sp-field-label>
                <sp-textfield placeholder="size=l" id="lifestory-size-l"></sp-textfield>
                <br />
                <sp-field-label for="lifestory-size-xl" size="xl" style="width: 100px">
                    Extra Large
                </sp-field-label>
                <sp-textfield placeholder="size=xl" id="lifestory-size-xl"></sp-textfield>
            </div>
        </div>
        
        <div id="right">
            <div id="subtitle">my-field-label</div>
            <my-field-label class="my-field-label" for="lifestory-5">
                my-field-label is italic
            </my-field-label>
            <sp-textfield
                placeholder="Enter your life story"
                id="lifestory-5"
            ></sp-textfield>
        </div>
    </div>

    <div id="config">
        <div style="display: inline-flex"></div>

        <div style="display: flex; flex-direction: column"></div>
    </div>
</div>
